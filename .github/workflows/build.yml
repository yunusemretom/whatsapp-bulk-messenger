name: Cross-Platform PyInstaller Build

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0 gibi tag atıldığında çalışır

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v3

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli paketleri yükle
        run: |
          pip install pyinstaller
          pip install PySide6 selenium webdriver_manager
      - name: PyInstaller ile exe oluştur
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=assets/resim.ico --name="OtonomWhatsApp" main2.py
      - name: EXE çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OtonomWhatsApp-Windows
          path: dist/OtonomWhatsApp.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v3

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli paketleri yükle
        run: |
          pip install pyinstaller
          pip install PySide6 selenium webdriver_manager
      - name: PyInstaller ile linux binary oluştur
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="OtonomWhatsApp" main2.py
      - name: Linux çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OtonomWhatsApp-Linux
          path: dist/OtonomWhatsApp

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v3

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli paketleri yükle
        run: |
          pip install pyinstaller
          pip install PySide6 selenium webdriver_manager
      - name: PyInstaller ile macOS binary oluştur
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="OtonomWhatsApp" main2.py
      - name: macOS çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: OtonomWhatsApp-macOS
          path: dist/OtonomWhatsApp