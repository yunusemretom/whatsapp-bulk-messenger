name: Cross-Platform PyInstaller Build

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0 gibi tag atıldığında çalışır

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v3

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli paketleri yükle
        run: |
          pip install pyinstaller
          pip install PySide6 selenium webdriver_manager

      - name: PyInstaller ile exe oluştur
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=assets/resim.ico --name="OtonomWhatsApp" main2.py

      

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v3

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli paketleri yükle
        run: |
          pip install pyinstaller
          pip install PySide6 selenium webdriver_manager

      - name: PyInstaller ile linux binary oluştur
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="OtonomWhatsApp" main2.py

      

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v3

      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli paketleri yükle
        run: |
          pip install pyinstaller
          pip install PySide6 selenium webdriver_manager

      - name: PyInstaller ile macOS binary oluştur
        run: |
          pyinstaller --noconfirm --onefile --windowed --name="OtonomWhatsApp" main2.py
